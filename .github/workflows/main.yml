name: Build Monkey

on:
  push:
    branches: [ "dev" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "dev" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - run: mvn -B -ntp clean package

      - uses: actions/upload-artifact@v4
        with:
          name: Genesis
          path: |
            target/*.jar
            !target/*-sources.jar
            !target/*-javadoc.jar

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/*.jar
            !target/*-sources.jar
            !target/*-javadoc.jar
