name: Build Release

on:
  push:
    branches: [ "dev" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - run: mvn -B -ntp clean package

      - id: meta
        run: |
          echo "TAG=dev-${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT
          echo "NAME=Dev Build #${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.TAG }}
          name: ${{ steps.meta.outputs.NAME }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            build/*.jar
            !build/*-sources.jar
            !build/*-javadoc.jar
